[project]
name = "enterprise-ai-assistant"
version = "0.1.0"
description = "Enterprise knowledge assistant: LangGraph multi-agent RAG with RLM, hybrid retrieval, RBAC, guardrails and LangSmith observability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "PyJWT>=2.9",
    "python-frontmatter>=1.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-anthropic>=0.3.5",
    "langchain-openai>=0.3",
    "langsmith>=0.2",
    "pinecone>=5.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.2",
    "streamlit>=1.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
